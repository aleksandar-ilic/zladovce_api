# ======================================================================================
# UNTESTED WORKFLOW
#
# This workflow has never been run: when it was written there was no AWS account, no
# bootstrapped environment and no GitHub repository. Treat every step as a first draft
# and expect to fix details on the first real run (start with staging).
#
# It is manual (workflow_dispatch) only. Automatic staging deploys from `main`
# (docs/AWS_INFRASTRUCTURE.md W7) should be switched on only after it has been proven.
#
# Prerequisites (see infrastructure/README.md, "First-time deploy checklist"):
#   - CDK bootstrap in the target account/region.
#   - An IAM OIDC identity provider for token.actions.githubusercontent.com and a deploy
#     role that trusts this repository (and, for production, the `production` environment)
#     and may assume the CDK bootstrap roles. No long-lived AWS keys are stored anywhere.
#   - GitHub environments `staging` and `production`, each with the variable
#     AWS_DEPLOY_ROLE_ARN (and optionally AWS_REGION, default eu-central-1).
#   - The `production` environment has "Required reviewers" configured = manual approval.
#   - The deploy role may also read and write the tracking-key secret of the environment
#     (secretsmanager:GetSecretValue + PutSecretValue on
#     arn:aws:secretsmanager:<region>:<account>:secret:zladovce/<env>/tracking-token-key-*) and invoke
#     the outbox worker (lambda:InvokeFunction on zladovce-<env>-outbox-worker), see step 2 and the
#     smoke tests.
#   - Optional (Phase 7): secretsmanager:GetSecretValue on
#     arn:aws:secretsmanager:<region>:<account>:secret:zladovce/<env>/site-rebuild-webhook-url-*, so that the
#     "Check the storefront rebuild webhook" step can warn while it is still the placeholder. Without the
#     permission that step only warns that it could not check; it never fails the deployment.
#   - Staging sends e-mail through the SES domain identity owned by prod (one shared account):
#     deploy Zladovce-Prod-Notifications once before staging can send (see infrastructure/README.md).
#
# The frontend is NOT built or deployed here: it lives in its own repository
# (https://github.com/aleksandar-ilic/zladovce_web) and is deployed by Amplify Hosting
# from that repository (infrastructure stack `Frontend`, off until amplify.enabled=true).
# ======================================================================================
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write # GitHub OIDC -> AWS STS
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  CDK_ENV: ${{ inputs.environment }}
  STACK_PREFIX: ${{ inputs.environment == 'prod' && 'Zladovce-Prod' || 'Zladovce-Staging' }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `production` must have required reviewers; the job waits here for approval.
    environment: ${{ inputs.environment == 'prod' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      # The backend has no packaging step of its own; the Lambda packages are produced here.
      # Framework-dependent publish for the .NET 10 managed runtime on arm64.
      - name: Publish API Lambda package
        run: >
          dotnet publish backend/src/Zladovce.Api -c Release -r linux-arm64
          --self-contained false -o backend/artifacts/api

      # One package for every non-HTTP handler: the migration runner (Migrations stack), the image
      # processor (Media stack) and the outbox worker (Api stack). Path = lambdaAssetPath in
      # infrastructure/lib/config.ts.
      - name: Publish Lambda package (migration runner, image processor, outbox worker)
        run: >
          dotnet publish backend/src/Zladovce.Lambda -c Release -r linux-arm64
          --self-contained false -o backend/artifacts/lambda

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
          role-session-name: zladovce-deploy-${{ inputs.environment }}-${{ github.run_id }}

      - name: Install CDK dependencies
        working-directory: infrastructure
        run: npm ci

      # requireArtifacts=true: synthesis fails if a Lambda package is missing (no placeholder code).
      - name: Show pending changes
        working-directory: infrastructure
        run: npx cdk diff --all -c env="$CDK_ENV" -c requireArtifacts=true || true

      # Step 1: the tracking-key secret and SES identity / configuration set. The stack has no
      # dependencies and must exist (with a valid key) before the API is deployed.
      - name: Deploy notifications stack (tracking key, SES)
        working-directory: infrastructure
        run: >
          npx cdk deploy "${STACK_PREFIX}-Notifications"
          -c env="$CDK_ENV" -c requireArtifacts=true
          --require-approval never --outputs-file outputs-notifications.json

      # Step 2: the tracking-code key. CloudFormation creates the secret with a placeholder
      # ({"status":"NOT-INITIALISED",...}) because Secrets Manager cannot generate "base64 of
      # exactly 32 bytes". While the placeholder is there, this step writes a fresh random key ONCE
      # (nothing can have been encrypted with the placeholder: the backend rejects it). Any other
      # invalid value fails the deployment BEFORE the API is touched - fix it by hand (README).
      # The value is never printed.
      - name: Verify (or initialise) the tracking-code key
        working-directory: infrastructure
        run: |
          set -euo pipefail
          STACK="${STACK_PREFIX}-Notifications"
          SECRET_ID=$(jq -r --arg stack "$STACK" '.[$stack].TrackingKeySecretName' outputs-notifications.json)

          # Exit code 0 = valid key, 2 = untouched placeholder, 1 = anything else (including the
          # public development key).
          check() {
            aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text \
              | python3 -c '
          import base64, binascii, json, sys
          value = sys.stdin.read().strip()
          if value.startswith("{"):
              document = json.loads(value)
              if document.get("status") == "NOT-INITIALISED" and "key" not in document:
                  sys.exit(2)
              value = str(document.get("key") or "").strip()
          # The public development key from backend/src/Zladovce.Api/appsettings.Development.json.
          if value == "ZGV2LW9ubHktdHJhY2tpbmcta2V5LTMyLWJ5dGVzISE=":
              sys.exit(1)
          try:
              ok = len(base64.b64decode(value, validate=True)) == 32
          except (binascii.Error, ValueError):
              ok = False
          sys.exit(0 if ok else 1)
          '
          }

          status=0; check || status=$?
          if [ "$status" = "2" ]; then
            echo "Tracking key of $SECRET_ID is still the placeholder; writing a new random key."
            KEY_FILE="$RUNNER_TEMP/tracking-key"
            ( umask 077; openssl rand -base64 32 | tr -d '\n' > "$KEY_FILE" )
            aws secretsmanager put-secret-value --secret-id "$SECRET_ID" \
              --secret-string "file://$KEY_FILE" > /dev/null
            rm -f "$KEY_FILE"
            status=0; check || status=$?
          fi
          if [ "$status" != "0" ]; then
            echo "::error::$SECRET_ID does not hold base64 of 32 bytes (or {\"key\":\"<base64>\"}). See infrastructure/README.md."
            exit 1
          fi
          echo "Tracking key of $SECRET_ID is valid."

      # Step 2b (Phase 7): the storefront rebuild webhook. Created by CloudFormation with a placeholder
      # ({"status":"NOT-CONFIGURED",...}, no "url"), which the backend treats as "not configured": the
      # outbox worker calls nothing and content changes wait (pending) until a URL is stored. This is a
      # WARNING only - a shop without a build hook still works, its storefront is just not rebuilt
      # automatically. The URL is a secret and is never printed. Fix: README "Storefront rebuild webhook".
      - name: Check the storefront rebuild webhook (warning only)
        working-directory: infrastructure
        continue-on-error: true
        run: |
          set -uo pipefail
          STACK="${STACK_PREFIX}-Notifications"
          SECRET_ID=$(jq -r --arg stack "$STACK" '.[$stack].SiteRebuildWebhookSecretName // empty' outputs-notifications.json)
          if [ -z "$SECRET_ID" ]; then
            echo "::warning::No SiteRebuildWebhookSecretName output; cannot check the rebuild webhook."
            exit 0
          fi
          if ! VALUE=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text 2>/dev/null); then
            echo "::warning::Could not read $SECRET_ID (deploy role lacks secretsmanager:GetSecretValue on it?); rebuild webhook not checked."
            exit 0
          fi
          # Same rules as the backend (SiteRebuildDispatcher): plain URL or {"url": "..."}; https only
          # (plain http only for loopback, which makes no sense here). Exit 0 = usable, 2 = placeholder, 1 = invalid.
          status=0
          printf '%s' "$VALUE" | python3 -c '
          import json, sys
          from urllib.parse import urlparse
          value = sys.stdin.read().strip()
          if value.startswith("{"):
              try:
                  document = json.loads(value)
              except ValueError:
                  sys.exit(1)
              if "url" not in document:
                  sys.exit(2 if document.get("status") == "NOT-CONFIGURED" else 1)
              value = str(document.get("url") or "").strip()
          url = urlparse(value)
          sys.exit(0 if url.scheme == "https" and url.netloc else 1)
          ' || status=$?
          unset VALUE
          case "$status" in
            0) echo "Storefront rebuild webhook in $SECRET_ID is set (https URL)." ;;
            2) echo "::warning::$SECRET_ID still holds the placeholder: content changes will NOT rebuild the storefront. Create the Amplify build hook and store it (infrastructure/README.md, 'Storefront rebuild webhook')." ;;
            *) echo "::warning::$SECRET_ID is not an https URL (or {\"url\":\"https://...\"}): the outbox worker ignores it and calls nothing." ;;
          esac
          exit 0

      # Step 3: everything the migration runner needs (network, database) and the runner itself.
      # The API stack is NOT deployed yet, so the running API version is untouched.
      - name: Deploy migration runner (and its dependencies)
        working-directory: infrastructure
        run: >
          npx cdk deploy "${STACK_PREFIX}-Migrations"
          -c env="$CDK_ENV" -c requireArtifacts=true
          --require-approval never --outputs-file outputs-migrations.json

      # Step 4: database roles, then migrations.
      #
      # {"action":"bootstrap"} creates/repairs the IAM-authenticated roles zladovce_migrator and
      # zladovce_app with the RDS-managed master secret. It is idempotent, so it runs on EVERY deploy
      # while the Migrations stack output MigrationBootstrapEnabled is "true"
      # (database.migrationRunnerCanReadMasterSecret in lib/config.ts). Running it every time means a
      # first deploy needs no manual step and a drifted role is repaired; the cost is a few seconds.
      # Setting the switch to false removes the master-secret permission and this step is skipped.
      #
      # {"action":"migrate"} then applies migrations (forward-only and backward-compatible, so the
      # currently running API version keeps working).
      - name: Bootstrap database roles and run migrations
        working-directory: infrastructure
        run: |
          set -euo pipefail
          STACK="${STACK_PREFIX}-Migrations"
          FUNCTION_NAME=$(jq -r --arg stack "$STACK" '.[$stack].MigrationFunctionName' outputs-migrations.json)
          BOOTSTRAP=$(jq -r --arg stack "$STACK" '.[$stack].MigrationBootstrapEnabled // "false"' outputs-migrations.json)

          invoke() {
            local action="$1"
            echo "Invoking $FUNCTION_NAME with action=$action"
            aws lambda invoke \
              --function-name "$FUNCTION_NAME" \
              --cli-binary-format raw-in-base64-out \
              --cli-read-timeout 330 \
              --payload "{\"action\":\"$action\"}" \
              "$action-result.json" > "$action-invoke.json"
            cat "$action-invoke.json"
            cat "$action-result.json"
            echo
            if [ "$(jq -r '.FunctionError // empty' "$action-invoke.json")" != "" ]; then
              echo "::error::Migration runner action '$action' failed"
              exit 1
            fi
          }

          if [ "$BOOTSTRAP" = "true" ]; then
            invoke bootstrap
          else
            echo "Role bootstrap disabled (MigrationBootstrapEnabled=$BOOTSTRAP); skipping."
          fi
          invoke migrate

      # Step 5: the new API version, the outbox worker and its schedule, and everything else (Media
      # stack with the image processor and its S3 trigger, Observability alarms, budget in prod, ...).
      - name: Deploy all stacks
        working-directory: infrastructure
        run: >
          npx cdk deploy --all
          -c env="$CDK_ENV" -c requireArtifacts=true
          --require-approval never --outputs-file outputs.json

      - name: Smoke test /health
        working-directory: infrastructure
        run: |
          set -euo pipefail
          API_URL=$(jq -r --arg stack "${STACK_PREFIX}-Api" '.[$stack].ApiUrl' outputs.json)
          echo "Checking $API_URL/health"
          for attempt in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o health.json -w '%{http_code}' --max-time 20 "$API_URL/health" || true)
            if [ "$STATUS" = "200" ]; then
              cat health.json
              echo
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $STATUS"
            sleep 10
          done
          echo "::error::Health check failed for $API_URL/health"
          exit 1

      # One synchronous run of the outbox worker: proves its configuration (the backend validates
      # e-mail/tracking settings at start), database access and tracking key. It does exactly what
      # the scheduled run does (sends due e-mails), so it is safe in every environment. A scheduled
      # run may hold the reserved concurrency of 1, hence the retries on throttling.
      - name: Smoke test outbox worker
        working-directory: infrastructure
        run: |
          set -euo pipefail
          FUNCTION_NAME=$(jq -r --arg stack "${STACK_PREFIX}-Api" '.[$stack].OutboxWorkerFunctionName' outputs.json)
          for attempt in 1 2 3 4; do
            if aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out \
                 --cli-read-timeout 130 --payload '{}' worker-result.json > worker-invoke.json; then
              cat worker-invoke.json; cat worker-result.json; echo
              if [ "$(jq -r '.FunctionError // empty' worker-invoke.json)" != "" ]; then
                echo "::error::Outbox worker run failed (see the function log)"
                exit 1
              fi
              echo "Outbox worker run passed"
              exit 0
            fi
            echo "Attempt $attempt: invoke failed (throttled while a scheduled run is active?)"
            sleep 30
          done
          echo "::error::Could not invoke $FUNCTION_NAME"
          exit 1

      - name: Summary
        if: always()
        working-directory: infrastructure
        run: |
          {
            echo "### Deploy to ${CDK_ENV}"
            echo "Commit: \`${GITHUB_SHA}\`"
            if [ -f outputs.json ]; then
              echo '```json'
              cat outputs.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
