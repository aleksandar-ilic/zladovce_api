# Amplify Hosting build specification - ADMIN (single-page application).
#
# This file is the single source of the build spec: lib/stacks/frontend-stack.ts
# reads it and sets it on the Amplify app.
#
# The frontend is its own repository (https://github.com/aleksandar-ilic/zladovce_web) with the
# Angular workspace at the repository ROOT, so this is a plain single-application spec
# (no "applications:"/"appRoot", no AMPLIFY_MONOREPO_APP_ROOT).
#
# Must match the frontend workspace:
#   - npm script:        build:admin
#   - output directory:  dist/admin/browser
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build:admin
  artifacts:
    baseDirectory: dist/admin/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
