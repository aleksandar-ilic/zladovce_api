# REFERENCE ONLY - the real headers are generated by lib/stacks/frontend-stack.ts
# (renderCustomHeaders), because the Content-Security-Policy contains the API URL,
# media URL and Cognito endpoint of the environment.
#
# The CSP is sent as Content-Security-Policy-Report-Only until `amplify.cspReportOnly`
# is set to false in lib/config.ts. Review browser console reports first, then enforce.
#
# Placeholders: <api-url>, <media-url>, <region>, <media-bucket>
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=()'
      # Storefront
      - key: 'Content-Security-Policy-Report-Only'
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: <media-url>; font-src 'self' data:; connect-src 'self' <api-url>; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      # Admin additionally allows Cognito sign-in and direct uploads to S3:
      #   connect-src 'self' <api-url> https://cognito-idp.<region>.amazonaws.com https://<media-bucket>.s3.<region>.amazonaws.com
